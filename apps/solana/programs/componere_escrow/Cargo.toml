[package]
name = "componere_escrow"
version = "0.1.0"
description = "Milestone escrow program for Componere on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "componere_escrow"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }